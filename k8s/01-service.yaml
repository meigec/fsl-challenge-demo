apiVersion: v1
kind: Service
metadata:
  name: fsl-app-headless
spec:
  clusterIP: None
  selector:
    app: fsl-app
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fsl-app
spec:
  type: LoadBalancer # LoadBalancer
  selector:
    app: fsl-app
  ports:
  - port: 8080
    targetPort: 8080